<article>
  <div class="container">
    <div class="image_prod">
      <img [src]="product.images[0].src" [alt]="product.images[0].alt">
    </div>
    <div class="link" (click)="open()">
      <i class="fa fa-info-circle fa-5x" aria-hidden="true"></i>
    </div>
    <div class="container__signature">
      <div class="container__signature-name">
        {{product.title}}              
      </div>
    </div>
  </div>
</article>
