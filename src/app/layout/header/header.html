<a href="/"><img
  src="/assets/images/logo.svg"
  alt="logo"
  class=""
></a>

<nav class="header-menu">

  <h1 class="h4 mt6">МетСервис-А</h1>

  <ul class="header-menu-list">
    @for (menuItem of menuItems; track menuItem) {
      <li>
        <a
          class="menu-item"
          [routerLink]="[menuItem.link]"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <svg [icon]="menuItem.icon" class="svg-icon"></svg>
          <span class="no-wrap">{{ menuItem.label }}</span>
        </a>
      </li>
    }
  </ul>

</nav>

<div class="header-btn">
  @if (username) {
    <p>Привет, {{username}}</p>
    <a class="btn to-header-btn" [routerLink]="['/account']">Профиль</a>
    <a class="btn to-header-btn" (click)="onLogout()">Выйти</a>
  } @else {
    <p></p>
    <a class="btn to-header-btn" [routerLink]="['/login']">Войти</a>
  }
</div>
