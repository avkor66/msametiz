@if (profile(); as profile) {
  @if (profile.avatarUrl) {
    <img [src]="profile.avatarUrl | imgUrl" alt="avatar">
  } @else {
    <img src="/assets/images/avatar.jpeg" alt="avatar">
  }

  <div class="username-name">
    <h1 class="h4 mb4">{{ profile.firstName }}</h1>
    <span class="regular"> {{ profile.firstName}}.{{ profile.lastName }}</span>
  </div>
}
