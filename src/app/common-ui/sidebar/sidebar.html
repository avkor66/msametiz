<img
  src="/assets/images/logo.svg"
  alt="logo"
  class="ml16 mb20"
>

<nav>
  <ul class="main-menu-list">
    @for (menuItem of menuItems; track menuItem) {
      <li>
        <a
          class="menu-item"
          [routerLink]="[menuItem.link]"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <svg [icon]="menuItem.icon" class="svg-icon"></svg>
          <span>{{ menuItem.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>

<p class="medium-text mb20">Подписчики</p>

@for ( profile of subscribers$ | async ; track profile.id) {
  <app-subscriber-card
    [profile]="profile"
  ></app-subscriber-card>
}

<div class="mt20 to-subscribers">
  <a
    [routerLink]="['/users/subscribers']"
    class="to-subscriber-link medium-text"
  >Все подписчики</a>
  <svg icon="arrow" class="to-subscriber-icon"></svg>
</div>


<footer class="sidebar__footer">
  @if (me(); as me) {
    @if (me.avatarUrl) {
      <img [src]="me.avatarUrl | imgUrl" alt="avatar">
    } @else {
      <img src="/assets/images/avatar.jpeg" alt="avatar">
    }
    <div class="medium-text username-text">{{ me.firstName }}.{{ me.lastName }}</div>
    <a [routerLink]="['/users/settings']" class="settings-btn">
      <svg icon="settings" class="svg-icon"></svg>
    </a>
  }
</footer>
