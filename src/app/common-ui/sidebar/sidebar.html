
<nav>
  <ul class="main-menu-list">
    @for (menuItem of menuItems; track menuItem) {
      <li>
        <a
          class="menu-item"
          [routerLink]="[menuItem.link]"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <svg [icon]="menuItem.icon" class="svg-icon"></svg>
          <span>{{ menuItem.label }}</span>
        </a>
      </li>
    }

      @if (me(); as me) {
          @if (me.role === "admin") {
              <li class="mt60">
                  <a
                          class="menu-item"
                          [routerLink]="['/admin']">
                      <svg icon="settings" class="svg-icon"></svg>
                      <span>Admin</span>
                  </a>
              </li>
          }
      }
  </ul>
</nav>

<footer class="sidebar__footer">
  @if (me(); as me) {
    @if (me.avatarUrl) {
      <img [src]="me.avatarUrl | imgUrl" alt="avatar">
    } @else {
      <img src="/assets/images/avatar.jpeg" alt="avatar">
    }
    <div class="medium-text username-text">{{ me.firstName }}.{{ me.lastName }}</div>
    <a [routerLink]="['/account/settings']" class="settings-btn">
      <svg icon="settings" class="svg-icon"></svg>
    </a>
  }
</footer>
