@if (profile$ | async; as profile) {
  <header class="profile-page__header">
    <app-profile-header
      [profile]="profile"
    ></app-profile-header>

    <a class="btn-custom to-setting-btn" [routerLink]="['/account/settings']">Редактировать
      <svg icon="settings" class="svg-icon"></svg>
    </a>

  </header>

  <main class="profile-page__body">
    <app-post-feed></app-post-feed>
  </main>
}
