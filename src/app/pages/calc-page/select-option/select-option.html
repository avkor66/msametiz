<div class="form-floating select-option" [formGroup]="formGroup">
    <select
        class="form-select"
        id="floatingSelect"
        aria-label="Выберите значение"
        [formControlName]="controlName"
    >
        @for (s of option; track s) {
          <option>{{ s }}</option>
        }
    </select>
    <label for="floatingSelect">{{ selectName }}</label>
</div>
