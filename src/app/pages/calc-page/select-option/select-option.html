<div class="select-option" [formGroup]="formGroup">
  <div class="select-option-line">
    <div class="window">
      <div class="window-name"><p>{{ selectName }}</p></div>
      <select
        class="window-select"
        [formControlName]="controlName"
      >
        @for (s of option; track s) {
          <option>{{ s }}</option>
        }
      </select>
    </div>
  </div>
</div>
