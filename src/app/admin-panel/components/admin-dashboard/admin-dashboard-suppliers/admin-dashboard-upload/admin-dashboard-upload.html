
<div class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-start">
        <div class="ms-2 me-auto">
            <div class="fw-bold my-2">Всего записей</div>
            <button type="button" class="btn btn-info mb-2" (click)="checkPrice()">Проверить данные</button>
            <button type="button" class="btn btn-danger" (click)="deletePrice()">Удалить данные</button>
        </div>
        <span class="badge text-bg-primary rounded-pill my-2 medium-text">{{ priceItems() }}</span>
    </li>
</div>

<img src="/assets/images/upload_xlsx.png" alt="upload_xlsx" class="avatar">
<div
    dnd
    class="dropzone"
    tabindex="0"
    (keyup.enter)="fileDrop.click()"
    (fileDropped)="onFileDroped($event)"
>

    <div class="dropzone-content">
        <svg icon="upload" class="svg-icon"></svg>
        <span class="large-text">Перетащите изображение или Загрузите</span>
    </div>


    <input
        tabindex="-1"
        type="file"
        class="avatar-input"
        #fileDrop
        (change)="fileBrowserHandler($event)"

    >

    @if (uploadStatus) {
        <div class="alert alert-info mt-3">
            {{ uploadStatus }}
        </div>
    }

    @if (uploadError) {
        <div class="alert alert-danger mt-3">
            {{ uploadError }}
        </div>
    }
</div>
